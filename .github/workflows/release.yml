# =====================================================================
# GitHub Actions — Build & Release automático do Scopel Store PDV
# =====================================================================
# Dispara quando uma tag v*.*.* é enviada (ex.: v1.1.0).
#
# Pontos que NÃO podem mudar sem quebrar a atualização remota:
#  - runs-on windows: o JAR embute os natives da JavaFX da plataforma do build
#    (-win); buildar em Linux geraria um JAR que não abre nos PDVs (Windows).
#  - JDK 25: a JavaFX 26 não compila/roda com JDK 21 (ver CLAUDE.md).
#  - O version.json só é publicado DEPOIS de o asset existir na Release, com o
#    SHA-256 e o tamanho do arquivo exato que foi anexado.
# =====================================================================

name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout (tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Versão a partir da tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      # Testes do ciclo de atualização (processos reais; sem banco).
      # A suíte completa exige PostgreSQL e roda localmente antes do release.
      - name: Testes do sistema de atualização
        run: >
          mvn -B test
          -Dtest='SemVerAndManifestTests,UpdaterLifecycleTests,UpdateServiceLifecycleTests'
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Build do JAR
        run: mvn -B clean package -DskipTests

      - name: Prepara asset, checksum e tamanho
        run: |
          mkdir -p staging
          cp "target/beta-${APP_VERSION}.jar" staging/scopel-store.jar
          SHA=$(sha256sum staging/scopel-store.jar | cut -d' ' -f1)
          SIZE=$(stat -c%s staging/scopel-store.jar)
          echo "$SHA  scopel-store.jar" > staging/scopel-store.jar.sha256
          echo "APP_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "APP_SIZE=$SIZE" >> "$GITHUB_ENV"

      - name: Cria a Release com o JAR anexado
        uses: softprops/action-gh-release@v2
        with:
          name: "Scopel Store ${{ env.APP_VERSION }}"
          body: |
            ## Scopel Store v${{ env.APP_VERSION }}

            SHA-256: `${{ env.APP_SHA256 }}`

            Os PDVs detectam esta versão sozinhos e oferecem **Atualizar e reiniciar**.
          files: |
            staging/scopel-store.jar
            staging/scopel-store.jar.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Só agora que o asset existe é que os PDVs passam a enxergar a versão.
      - name: Publica version.json na main
        run: |
          CHANGELOG=$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents:subject)')
          [ -z "$CHANGELOG" ] && CHANGELOG="Release ${APP_VERSION}"
          git fetch origin main
          git checkout -f -B main origin/main
          jq -n \
            --arg version "$APP_VERSION" \
            --arg date "$(date -u +%Y-%m-%d)" \
            --arg changelog "$CHANGELOG" \
            --arg sha "$APP_SHA256" \
            --argjson size "$APP_SIZE" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/scopel-store.jar" \
            '{version:$version, releaseDate:$date, minJavaVersion:24, changelog:$changelog,
              mandatory:false, sha256:$sha, size:$size, downloadUrl:$url}' > version.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore(release): version.json -> ${APP_VERSION} [skip ci]"
          git push origin main
