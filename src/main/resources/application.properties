spring.application.name=beta
# Credenciais NUNCA ficam no JAR (ele é publicado no GitHub): vêm do .env (formato KEY=VALOR,
# sem aspas). Dev: ./.env na pasta do projeto. App instalado (jpackage): o .cfg aponta para o
# .env da pasta de instalação via -Dspring.config.import.
# Obrigatória: DB_PASSWORD. Opcionais: DB_HOST, DB_PORT, DB_NAME, DB_USER.
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_scopel}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.main.web-application-type=none

# Impressora térmica ESC/POS + gaveta.
# Ligue com pdv.printer.enabled=true e informe o NOME EXATO da impressora no
# Windows (Painel de Controle > Dispositivos e Impressoras). Com enabled=false
# a impressão vai para o console (ConsolePrinter), sem hardware.
pdv.printer.enabled=true
pdv.printer.name=POS-80
# Pino da gaveta no conector RJ da impressora: 2 (mais comum) ou 5.
pdv.printer.drawer-pin=2

# =====================================================================
# Sistema de Atualização Remota (GitHub como servidor de updates)
# =====================================================================
app.update.enabled=true
# Versão = pom.xml (filtrada pelo Maven no build). NÃO escrever número fixo aqui.
app.update.current-version=@project.version@
app.update.version-url=https://raw.githubusercontent.com/httpscopelyan/System_Store/main/version.json
app.update.check-interval-seconds=20
# Estado do atualizador e backups ficam FORA do JAR, no diretório de trabalho.
app.update.download-dir=updates
app.update.backup-dir=backup

# Painel de administração web (conta DEV). Desligado por padrão.
# Opcionais no .env: ADMIN_WEB_ENABLED, ADMIN_WEB_BIND (127.0.0.1 ou 0.0.0.0), ADMIN_WEB_PORT,
# ADMIN_WEB_KEYSTORE (.p12) e ADMIN_WEB_KEYSTORE_PASSWORD (HTTPS direto),
# ADMIN_WEB_SECURE_COOKIE=true e ADMIN_WEB_TRUST_FORWARDED_FOR=true quando houver túnel/proxy HTTPS na frente.
admin.web.enabled=${ADMIN_WEB_ENABLED:false}
admin.web.bind=${ADMIN_WEB_BIND:127.0.0.1}
admin.web.port=${ADMIN_WEB_PORT:8443}
admin.web.keystore=${ADMIN_WEB_KEYSTORE:}
admin.web.keystore-password=${ADMIN_WEB_KEYSTORE_PASSWORD:}
admin.web.secure-cookie=${ADMIN_WEB_SECURE_COOKIE:false}
admin.web.trust-forwarded-for=${ADMIN_WEB_TRUST_FORWARDED_FOR:false}
